<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Interés Simple - UAE</title>
  <style>
    :root {
      --primary: #C00000;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #111827;
      --border: #E5E7EB;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h2 { color: var(--primary); margin-top: 0; font-size: 1.25rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; }
    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      background: var(--primary);
      color: #FFF;
      border: none;
      padding: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #A00000; }
    .results {
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .result-box {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 4px;
      text-align: center;
    }
    .result-box span { font-size: 0.75rem; color: #4B5563; display: block; }
    .result-box strong { font-size: 1.125rem; color: var(--primary); }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>Calculadora de Interés Simple - UAE</h2>
  <div class="form-group">
    <label for="capital">Capital Inicial ($)</label>
    <input type="number" id="capital" placeholder="Ej. 5000" step="any">
  </div>
  <div class="form-group">
    <label for="tasa">Tasa de Interés Anual (%)</label>
    <input type="number" id="tasa" placeholder="Ej. 8" step="any">
  </div>
  <div class="form-group">
    <label for="tiempo">Tiempo (Años)</label>
    <input type="number" id="tiempo" placeholder="Ej. 3" step="any">
  </div>
  <button id="btnCalcular">Calcular Rendimiento</button>

  <div class="results" id="panelResultados" style="display: none;">
    <div class="result-box">
      <span>Interés Devengado (I)</span>
      <strong id="outInteres">$0.00</strong>
    </div>
    <div class="result-box">
      <span>Monto Total (M)</span>
      <strong id="outMonto">$0.00</strong>
    </div>
  </div>
</div>

<script>
  document.getElementById('btnCalcular').addEventListener('click', () => {
    const capital = parseFloat(document.getElementById('capital').value);
    const tasa = parseFloat(document.getElementById('tasa').value);
    const tiempo = parseFloat(document.getElementById('tiempo').value);

    if (isNaN(capital) || isNaN(tasa) || isNaN(tiempo) || capital <= 0 || tasa < 0 || tiempo < 0) {
      alert('Por favor ingrese valores numéricos válidos en todos los campos.');
      return;
    }

    const tasaDecimal = tasa / 100;
    const interes = capital * tasaDecimal * tiempo;
    const monto = capital + interes;

    const formatoMoneda = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD'
    });

    document.getElementById('outInteres').textContent = formatoMoneda.format(interes);
    document.getElementById('outMonto').textContent = formatoMoneda.format(monto);
    document.getElementById('panelResultados').style.display = 'grid';
  });
</script>

</body>
</html>
